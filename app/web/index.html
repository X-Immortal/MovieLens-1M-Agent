<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MovieLens Agent</title>
  <link rel="stylesheet" href="/styles.css?v=5">
  <script src="/app.js?v=5" defer></script>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <aside class="rail" id="history-panel" aria-label="会话历史">
      <div class="rail-header"><a class="brand" href="/">MovieLens Agent</a><button id="close-history" class="text-button mobile-only" type="button">关闭</button></div>
      <button id="new-session" class="new-session" type="button">新建对话</button>
      <h2 class="rail-heading">历史对话</h2>
      <nav id="session-list" class="session-list" aria-label="历史对话"></nav>
    </aside>
    <main class="main-panel">
      <header class="topbar">
        <button id="toggle-history" class="text-button mobile-only" type="button" aria-expanded="false" aria-controls="history-panel">历史</button>
        <h1 id="conversation-title">新对话</h1>
        <button id="toggle-inspector" class="text-button" type="button" aria-expanded="false" aria-controls="inspector">分析资料</button>
      </header>
      <p id="setup-notice" class="setup-notice" hidden></p>
      <div id="conversation" class="conversation" aria-busy="false"></div>
      <div id="response-status" class="sr-only" role="status"></div>
      <div class="composer-wrap">
        <form id="composer" class="composer">
          <label for="prompt" class="sr-only">输入分析问题</label>
          <textarea id="prompt" rows="2" maxlength="4000" placeholder="输入问题，或继续追问…"></textarea>
          <div class="composer-footer"><span>Enter 发送，Shift + Enter 换行</span><button id="send" type="submit">发送</button></div>
        </form>
      </div>
    </main>
    <aside class="inspector" id="inspector" aria-label="分析资料" hidden>
      <div class="inspector-header"><h2>分析资料</h2><button id="close-inspector" class="text-button" type="button">关闭</button></div>
      <section class="inspector-section">
        <h3>报告下载</h3>
        <div id="report-list" class="artifact-list"></div>
        <details class="details"><summary>数据文件</summary><div id="artifact-list" class="artifact-list"></div></details>
      </section>
      <details class="inspector-section panel-details">
        <summary>数据与模型</summary><div id="data-status" class="data-status"></div>
      </details>
      <details class="inspector-section panel-details">
        <summary>实验管理</summary>
        <p class="side-copy">清洗数据变更后，可重新训练六种分析模型。</p>
        <button id="train" class="secondary-button" type="button">训练新实验</button>
        <div id="train-status" class="side-message" role="status"></div>
      </details>
    </aside>
  </div>
  <div id="toast" class="toast" role="alert" hidden></div>
</body>
</html>
